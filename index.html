<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mini Bataille – Nord & Sud</title>
<style>
  body { font-family: Arial; text-align: center; }
  #field {
    width: 800px;
    height: 120px;
    background: #eef;
    margin: 30px auto;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
  }
  .unit {
    position: absolute;
    font-size: 40px;
    transition: left 0.1s linear;
  }
  button { padding: 10px 20px; margin: 10px; font-size: 18px; }
</style>
</head>
<body>

<h1>Mini Bataille – Style Nord & Sud</h1>

<h3>Mode de jeu</h3>
<select id="mode">
  <option value="pvp">Humain vs Humain</option>
  <option value="ai_easy">Humain vs IA (facile)</option>
  <option value="ai_hard">Humain vs IA (difficile)</option>
</select>

<div id="field"></div>

<h2>Envoyer une unité</h2>
<button onclick="spawnUnit(1,'infantry')">🪖 Infanterie</button>
<button onclick="spawnUnit(1,'cavalry')">🐎 Cavalerie</button>
<button onclick="spawnUnit(1,'artillery')">💣 Artillerie</button>

<h2 id="status"></h2>

<script>
const field = document.getElementById("field");
let units = [];

const stats = {
  infantry:  { emoji:"🪖", speed:1,  range:40, power:2 },
  cavalry:   { emoji:"🐎", speed:2,  range:20, power:3 },
  artillery: { emoji:"💣", speed:0.5, range:120, power:4 }
};

function spawnUnit(player, type) {
  const u = document.createElement("div");
  u.className = "unit";
  u.textContent = stats[type].emoji;

  const obj = {
    el: u,
    player,
    type,
    x: player === 1 ? 10 : 750,
    hp: 5
  };

  u.style.left = obj.x + "px";
  u.style.top = (player === 1 ? 20 : 60) + "px";

  field.appendChild(u);
  units.push(obj);
}

function update() {
  for (let u of units) {
    const s = stats[u.type];
    u.x += u.player === 1 ? s.speed : -s.speed;
    u.el.style.left = u.x + "px";
  }

  resolveCombat();
  removeDead();
  checkVictory();

  requestAnimationFrame(update);
}

function resolveCombat() {
  for (let a of units) {
    for (let b of units) {
      if (a.player !== b.player) {
        const dist = Math.abs(a.x - b.x);
        const ra = stats[a.type].range;
        const rb = stats[b.type].range;

        if (dist < ra) b.hp -= stats[a.type].power;
        if (dist < rb) a.hp -= stats[b.type].power;
      }
    }
  }
}

function removeDead() {
  units = units.filter(u => {
    if (u.hp <= 0) {
      u.el.remove();
      return false;
    }
    return true;
  });
}

function checkVictory() {
  const p1 = units.some(u => u.player === 1);
  const p2 = units.some(u => u.player === 2);

  if (!p1) document.getElementById("status").textContent = "Joueur 2 gagne !";
  if (!p2) document.getElementById("status").textContent = "Joueur 1 gagne !";
}

function aiLoop() {
  const mode = document.getElementById("mode").value;
  if (mode === "pvp") return;

  if (Math.random() < (mode === "ai_easy" ? 0.02 : 0.05)) {
    const types = ["infantry","cavalry","artillery"];
    const pick = types[Math.floor(Math.random()*types.length)];
    spawnUnit(2, pick);
  }
}

setInterval(aiLoop, 200);
update();
</script>

</body>
</html>
