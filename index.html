<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bataille – Nord & Sud</title>
<style>
  body { font-family: Arial; text-align: center; }
  #battlefield {
    display: flex;
    justify-content: space-between;
    width: 700px;
    margin: 40px auto;
    padding: 20px;
    background: #eef;
    border-radius: 10px;
  }
  .unit {
    font-size: 40px;
    cursor: pointer;
    padding: 10px;
  }
  #log { margin-top: 20px; white-space: pre-line; }
  button { padding: 10px 20px; margin: 10px; font-size: 18px; }
</style>
</head>
<body>

<h1>Bataille – Mini Nord & Sud</h1>

<div id="battlefield"></div>

<h2>Tour du joueur <span id="turn">1</span></h2>

<button onclick="moveLeft()">⬅️ Gauche</button>
<button onclick="moveRight()">➡️ Droite</button>

<div id="log"></div>

<script>
// Unités avec emoji
const unitTypes = {
  infantry:  { emoji: "🪖", beats: "cavalry" },
  cavalry:   { emoji: "🐎", beats: "artillery" },
  artillery: { emoji: "💣", beats: "infantry" }
};

// Armées
let army1 = [
  { type: "infantry",  pos: 1 },
  { type: "cavalry",   pos: 2 },
  { type: "artillery", pos: 3 }
];

let army2 = [
  { type: "infantry",  pos: 7 },
  { type: "cavalry",   pos: 6 },
  { type: "artillery", pos: 5 }
];

let currentPlayer = 1;
let selected = null;

function draw() {
  const field = document.getElementById("battlefield");
  field.innerHTML = "";

  for (let i = 1; i <= 7; i++) {
    let cell = document.createElement("div");
    cell.style.width = "80px";
    cell.style.height = "80px";
    cell.style.display = "flex";
    cell.style.alignItems = "center";
    cell.style.justifyContent = "center";

    let u1 = army1.find(u => u.pos === i);
    let u2 = army2.find(u => u.pos === i);

    if (u1) {
      let div = document.createElement("div");
      div.className = "unit";
      div.textContent = unitTypes[u1.type].emoji;
      div.onclick = () => selectUnit(1, u1);
      cell.appendChild(div);
    }

    if (u2) {
      let div = document.createElement("div");
      div.className = "unit";
      div.textContent = unitTypes[u2.type].emoji;
      div.onclick = () => selectUnit(2, u2);
      cell.appendChild(div);
    }

    field.appendChild(cell);
  }
}

function selectUnit(player, unit) {
  if (player !== currentPlayer) return;
  selected = unit;
  log("Unité sélectionnée : " + unitTypes[unit.type].emoji);
}

function moveLeft() {
  if (!selected) return;
  selected.pos--;
  resolveCombat();
  endTurn();
}

function moveRight() {
  if (!selected) return;
  selected.pos++;
  resolveCombat();
  endTurn();
}

function resolveCombat() {
  for (let i = 1; i <= 7; i++) {
    let u1 = army1.find(u => u.pos === i);
    let u2 = army2.find(u => u.pos === i);

    if (u1 && u2) {
      fight(u1, u2);
    }
  }
}

function fight(a, b) {
  const A = unitTypes[a.type];
  const B = unitTypes[b.type];

  if (A.beats === b.type) {
    log(`${A.emoji} bat ${B.emoji}`);
    army2 = army2.filter(u => u !== b);
  } else if (B.beats === a.type) {
    log(`${B.emoji} bat ${A.emoji}`);
    army1 = army1.filter(u => u !== a);
  } else {
    log(`${A.emoji} et ${B.emoji} s'éliminent`);
    army1 = army1.filter(u => u !== a);
    army2 = army2.filter(u => u !== b);
  }

  checkVictory();
}

function checkVictory() {
  if (army1.length === 0) {
    alert("Joueur 2 gagne !");
  }
  if (army2.length === 0) {
    alert("Joueur 1 gagne !");
  }
}

function endTurn() {
  selected = null;
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  document.getElementById("turn").textContent = currentPlayer;
  draw();
}

function log(t) {
  document.getElementById("log").textContent += t + "\n";
}

draw();
</script>

</body>
</html>
