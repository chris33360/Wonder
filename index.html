<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Duel de Canons – Vent, Obstacles & Déplacement</title>
<style>
  body { font-family: Arial; text-align: center; }
  #game {
    position: relative;
    width: 900px;
    height: 400px;
    margin: 20px auto;
    background: linear-gradient(#87ceeb 50%, #4caf50 50%);
    border-radius: 10px;
    overflow: hidden;
  }
  .cannon {
    position: absolute;
    font-size: 40px;
  }
  #player { left: 40px; bottom: 180px; }
  #ai { right: 40px; bottom: 180px; }
  .projectile {
    position: absolute;
    font-size: 24px;
  }
  .obstacle {
    position: absolute;
    width: 40px;
    height: 120px;
    background: #654321;
    bottom: 0;
    border-radius: 5px;
  }
  #powerBar {
    width: 300px;
    height: 20px;
    background: #ddd;
    margin: 10px auto;
    border-radius: 10px;
    overflow: hidden;
  }
  #powerFill {
    height: 100%;
    width: 0%;
    background: red;
  }
  button { margin: 5px; padding: 10px 20px; }
</style>
</head>
<body>

<h1>Duel de Canons – Vent, Obstacles & Déplacement</h1>

<div>
  <button onclick="toggleWind()">Vent : <span id='windState'>ON</span></button>
  <button onclick="toggleObstacles()">Obstacles : <span id='obsState'>ON</span></button>
</div>

<h3>Vent actuel : <span id="windValue">0</span></h3>

<div id="game">
  <div id="player" class="cannon">🧨</div>
  <div id="ai" class="cannon">🧨</div>

  <div id="obs1" class="obstacle" style="left:420px;"></div>
  <div id="obs2" class="obstacle" style="left:460px;"></div>
</div>

<h3>Maintiens clic ou ESPACE pour charger, relâche pour tirer</h3>

<div id="powerBar"><div id="powerFill"></div></div>

<h2 id="status">Charge ton tir…</h2>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const ai = document.getElementById("ai");
const statusEl = document.getElementById("status");
const powerFill = document.getElementById("powerFill");

let charging = false;
let power = 0;
let projectile = null;
let aiAlive = true;
let playerAlive = true;

// Options
let windEnabled = true;
let obstaclesEnabled = true;

// Vent
let wind = 0;
function updateWind() {
  if (!windEnabled) {
    wind = 0;
    document.getElementById("windValue").textContent = "0";
    return;
  }
  wind = Math.floor(Math.random() * 20) - 10;
  document.getElementById("windValue").textContent = wind;
}
setInterval(updateWind, 5000);
updateWind();

// -------------------------
// TOGGLE OPTIONS
// -------------------------
function toggleWind() {
  windEnabled = !windEnabled;
  document.getElementById("windState").textContent = windEnabled ? "ON" : "OFF";
  updateWind();
}

function toggleObstacles() {
  obstaclesEnabled = !obstaclesEnabled;
  document.getElementById("obsState").textContent = obstaclesEnabled ? "ON" : "OFF";
  document.getElementById("obs1").style.display = obstaclesEnabled ? "block" : "none";
  document.getElementById("obs2").style.display = obstaclesEnabled ? "block" : "none";
}

// -------------------------
// DEPLACEMENT VERTICAL JOUEUR
// -------------------------
function movePlayer(dy) {
  if (!playerAlive) return;
  let current = parseInt(player.style.bottom);
  let next = current + dy;

  if (next < 50) next = 50;
  if (next > 300) next = 300;

  player.style.bottom = next + "px";
}

document.addEventListener("keydown", e => {
  if (e.code === "ArrowUp" || e.code === "KeyZ") movePlayer(10);
  if (e.code === "ArrowDown" || e.code === "KeyS") movePlayer(-10);
});

// -------------------------
// DEPLACEMENT VERTICAL IA
// -------------------------
function aiMove() {
  if (!aiAlive) return;

  let current = parseInt(ai.style.bottom);
  let next = current + (Math.random() < 0.5 ? 10 : -10);

  if (next < 50) next = 50;
  if (next > 300) next = 300;

  ai.style.bottom = next + "px";
}
setInterval(aiMove, 800);

// -------------------------
// CHARGE DU TIR
// -------------------------
function startCharge() {
  if (!playerAlive || !aiAlive) return;
  charging = true;
  power = 0;
  chargeLoop();
}

function stopCharge() {
  if (!charging) return;
  charging = false;
  shoot(power);
}

function chargeLoop() {
  if (!charging) return;
  power += 1;
  if (power > 100) power = 100;
  powerFill.style.width = power + "%";
  requestAnimationFrame(chargeLoop);
}

// -------------------------
// TIR DU JOUEUR (HORIZONTAL)
// -------------------------
function shoot(power) {
  const rect = game.getBoundingClientRect();
  const cRect = player.getBoundingClientRect();

  const startX = cRect.left - rect.left + 30;
  const startY = rect.bottom - cRect.top - 20;

  const speed = power / 3;

  projectile = {
    x: startX,
    y: startY,
    vx: speed,
    vy: 0,
    el: createProjectile(startX, startY)
  };

  animateProjectile();
}

function createProjectile(x, y) {
  const p = document.createElement("div");
  p.className = "projectile";
  p.textContent = "💥";
  p.style.left = x + "px";
  p.style.bottom = y + "px";
  game.appendChild(p);
  return p;
}

// -------------------------
// ANIMATION DU PROJECTILE
// -------------------------
function animateProjectile() {
  if (!projectile) return;

  projectile.x += projectile.vx + wind * 0.05;

  projectile.el.style.left = projectile.x + "px";
  projectile.el.style.bottom = projectile.y + "px";

  if (projectile.x < 0 || projectile.x > 900) return endShot();

  if (obstaclesEnabled && checkObstacle(projectile.x, projectile.y)) {
    return endShot();
  }

  if (checkHit(ai, projectile.x, projectile.y)) {
    ai.textContent = "💥";
    aiAlive = false;
    statusEl.textContent = "🎉 Tu as gagné !";
    return endShot(true);
  }

  requestAnimationFrame(animateProjectile);
}

function checkObstacle(px, py) {
  const obs1 = document.getElementById("obs1").getBoundingClientRect();
  const obs2 = document.getElementById("obs2").getBoundingClientRect();
  const rect = game.getBoundingClientRect();

  const x = px + rect.left;
  const y = rect.bottom - py;

  return (
    (x > obs1.left && x < obs1.right && y > obs1.top && y < obs1.bottom) ||
    (x > obs2.left && x < obs2.right && y > obs2.top && y < obs2.bottom)
  );
}

function checkHit(cannon, px, py) {
  const rect = game.getBoundingClientRect();
  const cRect = cannon.getBoundingClientRect();

  const cx = cRect.left - rect.left + 20;
  const cy = rect.bottom - cRect.top;

  const dx = px - cx;
  const dy = py - cy;

  return Math.sqrt(dx*dx + dy*dy) < 30;
}

function endShot(hit) {
  if (projectile) projectile.el.remove();
  projectile = null;
  powerFill.style.width = "0%";
}

// -------------------------
// IA TIR (HORIZONTAL)
// -------------------------
function aiLoop() {
  if (!aiAlive || !playerAlive) return;

  const power = 40 + Math.random() * 60;
  aiShoot(power);

  setTimeout(aiLoop, 1500);
}

function aiShoot(power) {
  const rect = game.getBoundingClientRect();
  const cRect = ai.getBoundingClientRect();

  const startX = cRect.left - rect.left - 10;
  const startY = rect.bottom - cRect.top - 20;

  const speed = power / 3;

  const proj = {
    x: startX,
    y: startY,
    vx: -speed,
    vy: 0,
    el: createProjectile(startX, startY)
  };

  function animateAI() {
    proj.x += proj.vx + wind * 0.05;

    proj.el.style.left = proj.x + "px";
    proj.el.style.bottom = proj.y + "px";

    if (proj.x < 0 || proj.x > 900) {
      proj.el.remove();
      return;
    }

    if (obstaclesEnabled && checkObstacle(proj.x, proj.y)) {
      proj.el.remove();
      return;
    }

    if (checkHit(player, proj.x, proj.y)) {
      player.textContent = "💥";
      playerAlive = false;
      statusEl.textContent = "😵 L'IA t'a touché !";
      proj.el.remove();
      return;
    }

    requestAnimationFrame(animateAI);
  }

  animateAI();
}

// -------------------------
// CONTROLES
// -------------------------
document.addEventListener("mousedown", startCharge);
document.addEventListener("mouseup", stopCharge);

document.addEventListener("keydown", e => {
  if (e.code === "Space") startCharge();
});
document.addEventListener("keyup", e => {
  if (e.code === "Space") stopCharge();
});

// Lancement IA
aiLoop();
</script>

</body>
</html>
